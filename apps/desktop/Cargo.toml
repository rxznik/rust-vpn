[package]
name = "rustvpn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arboard = "3"
image = "0.25"
libc = "0.2"
open = "5"
rfd = "0.15"
rqrr = "0.7"
rvpn-app = { path = "../../crates/app" }
rvpn-model = { path = "../../crates/model" }
rvpn-platform = { path = "../../crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "unstable-fontique-011", "unstable-winit-030"] }
swash = "0.2.10"

[build-dependencies]
slint-build = "1.18"
